<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" rx="14" fill="#0b0f17"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b97ae"/>
    </marker>
  </defs>
  <g font-size="13" fill="#e6ebf5">
    <!-- inputs -->
    <rect x="20" y="40" width="170" height="220" rx="10" fill="#121826" stroke="#243049"/>
    <text x="105" y="66" text-anchor="middle" font-weight="600">Company profile</text>
    <text x="36" y="96" fill="#8b97ae" font-size="12">• organisation &amp; finances</text>
    <text x="36" y="120" fill="#8b97ae" font-size="12">• attack surface</text>
    <text x="36" y="144" fill="#8b97ae" font-size="12">• defences</text>
    <text x="36" y="168" fill="#8b97ae" font-size="12">• recovery readiness</text>
    <text x="36" y="192" fill="#8b97ae" font-size="12">• threat scenario</text>
    <text x="48" y="212" fill="#8b97ae" font-size="12">(swarm size, skill)</text>

    <!-- simulator -->
    <rect x="240" y="30" width="210" height="110" rx="10" fill="#121826" stroke="#e5484d"/>
    <text x="345" y="56" text-anchor="middle" font-weight="600">Agent-based swarm simulator</text>
    <text x="256" y="80" fill="#8b97ae" font-size="11.5">recon → access → lateral spread →</text>
    <text x="256" y="98" fill="#8b97ae" font-size="11.5">detection → detonation → recovery</text>
    <text x="256" y="116" fill="#8b97ae" font-size="11.5">→ losses → collapse?</text>

    <!-- dataset -->
    <rect x="240" y="170" width="210" height="90" rx="10" fill="#121826" stroke="#243049"/>
    <text x="345" y="198" text-anchor="middle" font-weight="600">300k simulated campaigns</text>
    <text x="345" y="222" text-anchor="middle" fill="#8b97ae" font-size="11.5">synthetic companies around</text>
    <text x="345" y="240" text-anchor="middle" fill="#8b97ae" font-size="11.5">a latent security maturity</text>

    <!-- models -->
    <rect x="500" y="40" width="200" height="220" rx="10" fill="#121826" stroke="#4f8cff"/>
    <text x="600" y="66" text-anchor="middle" font-weight="600">ML surrogate models</text>
    <text x="516" y="96" fill="#8b97ae" font-size="12">• P(breach)</text>
    <text x="516" y="118" fill="#8b97ae" font-size="12">• P(severe damage)</text>
    <text x="516" y="140" fill="#8b97ae" font-size="12">• P(collapse)</text>
    <text x="516" y="162" fill="#8b97ae" font-size="12">• P(detonation | breach)</text>
    <text x="516" y="184" fill="#8b97ae" font-size="12">• damage regressor</text>
    <text x="516" y="206" fill="#8b97ae" font-size="12">• recovery &amp; loss quantile</text>
    <text x="528" y="224" fill="#8b97ae" font-size="12">mixtures (monotonic GBMs)</text>

    <!-- outputs -->
    <rect x="750" y="40" width="190" height="220" rx="10" fill="#121826" stroke="#30a46c"/>
    <text x="845" y="66" text-anchor="middle" font-weight="600">Decision layer</text>
    <text x="766" y="96" fill="#8b97ae" font-size="12">• grade &amp; resilience score</text>
    <text x="766" y="118" fill="#8b97ae" font-size="12">• recovery time range</text>
    <text x="766" y="140" fill="#8b97ae" font-size="12">• risk drivers</text>
    <text x="766" y="162" fill="#8b97ae" font-size="12">• ranked recommendations</text>
    <text x="766" y="184" fill="#8b97ae" font-size="12">• threat curves</text>
    <text x="766" y="206" fill="#8b97ae" font-size="12">• dashboard · API · CLI</text>
  </g>
  <g stroke="#8b97ae" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M190 100 L238 90"/>
    <path d="M345 140 L345 168"/>
    <path d="M450 215 L498 190"/>
    <path d="M700 150 L748 150"/>
    <path d="M450 85 Q600 10 760 38" stroke-dasharray="5 4"/>
  </g>
  <text x="610" y="22" font-size="11" fill="#8b97ae" text-anchor="middle">on-demand Monte-Carlo replay &amp; cross-check</text>
</svg>
